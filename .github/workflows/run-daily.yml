on:
  workflow_dispatch:

  schedule:
    - cron: '07 11 * * *' # UTC -5 for 6:00 AM local time during daylight savings. Used arbitrary minute to try and speed up que. 

jobs: 
  run_main:
    runs-on: ubuntu-latest

    steps: 
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Install dependencies
      run: uv sync

    - name: Run main.py
      uses: nick-fields/retry@v3
      with: 
        timeout_minutes: 10
        max_attempts: 3
        command: uv run ./src/main.py ${{ secrets.USGS_API_KEY }}

    - name: Git push data and map updates to the repo
      run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add content data/daily
          git commit -m "update data and map htmls - github action" || echo "No changes to commit"

          git push